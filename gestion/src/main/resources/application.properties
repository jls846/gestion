# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 6 detecta automáticamente el dialecto, pero si quieres ser específico para MySQL 8+:
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Evita el warning de rendimiento en los logs
spring.jpa.open-in-view=false